kind = "web"
previewPath = "/theme-preview/"
title = "Rafríkið Theme Preview"
description = "A live browser preview of the Rafríkið Shopify theme — renders the key pages (home, collection, product detail, hraðpöntun quick order) as pixel-accurate HTML/CSS mockups using the exact design tokens, PE stripe, copper palette, and Archivo/Public Sans/IBM Plex Mono fonts from base.css. VAT toggle is fully interactive. No Shopify store required."
version = "1.0.0"
id = "artifacts/theme-preview"
router = "path"

[[services]]
name = "web"
paths = [ "/theme-preview/" ]
localPort = 20716

[services.development]
run = "pnpm --filter @workspace/theme-preview run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/theme-preview", "run", "build" ]
serve = "static"
publicDir = "artifacts/theme-preview/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20716"
BASE_PATH = "/theme-preview/"
